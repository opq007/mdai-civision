[project]
name = "mdai-civision"
version = "0.1.0"
description = "OpenAI-compatible video generation on top of ModelScope Civision"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # The `socks` extra (`socksio`) is what lets httpx speak SOCKS5. It is
    # optional upstream, so without it HTTP proxies work and every SOCKS5
    # proxy fails while constructing the client.
    "httpx[socks]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "cryptography>=42",
    "prometheus-client>=0.20",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
